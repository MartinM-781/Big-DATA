name: ece-bigdata-imdb

x-spark-common: &spark-common
  build:
    context: .
    dockerfile: docker/spark/Dockerfile
  image: ece-imdb-spark:latest
  user: root
  working_dir: /opt/project
  env_file:
    - path: .env
      required: false
  environment:
    DATA_DIR: /data
    RESULTS_DIR: /opt/project/results
    KAFKA_BOOTSTRAP: kafka:9092
  volumes:
    - .:/opt/project
    - ${DATA_DIR:-imdb-data}:/data

services:
  # One-shot batch container: `docker compose run --rm spark spark-submit jobs/<job>.py`
  spark:
    <<: *spark-common
    profiles: ["batch"]
    command: ["spark-submit", "--version"]

  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Wikimedia EventStreams (SSE) -> Kafka topic `wiki.recentchange`
  producer:
    <<: *spark-common
    profiles: ["streaming"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      LATE_FRACTION: ${LATE_FRACTION:-0}
      LATE_DELAY: ${LATE_DELAY:-900}
    restart: unless-stopped
    command: ["python3", "-u", "producer/wiki_to_kafka.py"]

volumes:
  imdb-data:
